# CI workflow: compile checks + deterministic regression suite, no Ollama
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install requests
      - name: Syntax check
        run: python -m py_compile $(ls *.py) $(ls eval_harness/*.py) $(ls tests/*.py)
      - name: Regression tests
        run: python -m unittest discover -s tests -v
