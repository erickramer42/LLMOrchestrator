# CI workflow: compile checks + deterministic regression suite, no Ollama
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # README promises 3.11+: test the floor and the newest
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile $(ls *.py) $(ls eval_harness/*.py) $(ls tests/*.py)
      - name: Regression tests
        run: python -m unittest discover -s tests -v
